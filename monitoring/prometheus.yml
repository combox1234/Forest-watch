global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'forestwatch-central'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['central-server:8099']
        labels:
          role: 'coordinator'
          service: 'central-server'

  - job_name: 'forestwatch-sensor-nodes'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['sensor-1:8101']
        labels:
          node: 'S1'
          cluster: 'C1'
      - targets: ['sensor-2:8102']
        labels:
          node: 'S2'
          cluster: 'C1'
      - targets: ['sensor-3:8103']
        labels:
          node: 'S3'
          cluster: 'C2'
      - targets: ['sensor-4:8104']
        labels:
          node: 'S4'
          cluster: 'C2'
