global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 2h
  receiver: 'forestwatch-default-receiver'
  routes:
    - match:
        severity: critical
      receiver: 'forestwatch-emergency-receiver'
      continue: true

receivers:
  - name: 'forestwatch-default-receiver'
    webhook_configs:
      - url: 'http://central-server:8099/api/log-message'
        send_resolved: true

  - name: 'forestwatch-emergency-receiver'
    webhook_configs:
      - url: 'http://central-server:8099/api/alert'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster']
