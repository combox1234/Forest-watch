groups:
  - name: ForestWatchOperationalAlerts
    rules:
      - alert: CentralServerDown
        expr: up{job="forestwatch-central"} == 0
        for: 15s
        labels:
          severity: critical
          team: forestwatch-ops
        annotations:
          summary: "ForestWatch Central Server instance is down"
          description: "Central Coordinator on port 8099 has failed Prometheus scrapes for > 15 seconds."

      - alert: SensorNodeDown
        expr: up{job="forestwatch-sensor-nodes"} == 0
        for: 15s
        labels:
          severity: critical
          team: forestwatch-ops
        annotations:
          summary: "ForestWatch sensor node {{ $labels.node }} is unreachable"
          description: "Sensor {{ $labels.node }} in cluster {{ $labels.cluster }} is not responding to heartbeats or HTTP scrapes."

      - alert: HighHttpErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[1m]) > 0.05
        for: 30s
        labels:
          severity: warning
          team: forestwatch-ops
        annotations:
          summary: "High HTTP 5xx error rate detected"
          description: "HTTP 5xx error rate exceeds 5% of all traffic over the past minute."

      - alert: HighJvmHeapUsage
        expr: (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) > 0.85
        for: 30s
        labels:
          severity: warning
          team: forestwatch-ops
        annotations:
          summary: "JVM heap usage exceeds 85%"
          description: "JVM memory usage on {{ $labels.instance }} is above 85% for 30s."
