name: ForestWatch Continuous Delivery (CD)

on:
  workflow_run:
    workflows: ["ForestWatch CI/CD Pipeline"]
    branches: ["main"]
    types:
      - completed

  workflow_dispatch:
    inputs:
      target_commit:
        description: "Specific Commit SHA to deploy (defaults to latest main)"
        required: false
        default: "main"

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy to AWS EC2 (Production)
    runs-on: ubuntu-latest

    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}

    environment:
      name: production
      url: http://${{ vars.EC2_PUBLIC_IP || 'aws-ec2' }}/

    permissions:
      contents: read
      actions: read

    steps:
      - name: Validate Deployment Prerequisites
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID || vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -e

          echo "Starting ForestWatch deployment..."

          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "ERROR: AWS_ACCESS_KEY_ID or AWS_SECRET_ACCESS_KEY secret is missing."
            exit 1
          fi

          if [ -z "$INSTANCE_ID" ]; then
            echo "ERROR: EC2_INSTANCE_ID is missing."
            exit 1
          fi

          echo "AWS credentials and target instance configured."
          echo "Region: $AWS_REGION"
          echo "Target: $INSTANCE_ID"

      - name: Validate and Resolve Deployment Commit
        id: resolve_commit
        env:
          INPUT_COMMIT: ${{ inputs.target_commit }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            COMMIT="${INPUT_COMMIT:-main}"
          else
            COMMIT="$WORKFLOW_SHA"
          fi

          if [[ ! "$COMMIT" =~ ^(main|[0-9a-fA-F]{7,40})$ ]]; then
            echo "ERROR: Invalid commit or branch input."
            exit 1
          fi

          RESOLVED_SHA=$(gh api "repos/${REPO}/commits/${COMMIT}" --jq '.sha')

          if [[ ! "$RESOLVED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "ERROR: Could not resolve target commit."
            exit 1
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            CI_RUNS=$(gh api \
              "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${RESOLVED_SHA}&status=completed" \
              --jq '[.workflow_runs[] | select(.conclusion == "success" and .head_branch == "main")] | length')

            if [ "${CI_RUNS:-0}" -lt 1 ]; then
              echo "ERROR: No successful main-branch CI run found for this commit."
              exit 1
            fi
          fi

          echo "target_commit=$RESOLVED_SHA" >> "$GITHUB_OUTPUT"
          echo "Deployment commit validated."

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Verify AWS Access
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID || vars.EC2_INSTANCE_ID }}
        run: |
          set -e
          aws sts get-caller-identity
          aws ssm describe-instance-information --region "${{ vars.AWS_REGION || 'ap-south-1' }}" >/dev/null
          echo "AWS authentication successful."

      - name: Dispatch Deployment via SSM
        id: ssm_deploy
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID || vars.EC2_INSTANCE_ID }}
          COMMIT_SHA: ${{ steps.resolve_commit.outputs.target_commit }}
        run: |
          set -e

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "ForestWatch deployment $COMMIT_SHA" \
            --parameters "commands=[
              \"set -e\",
              \"cd /home/ubuntu/Forest-watch\",
              \"bash deploy_aws.sh $COMMIT_SHA\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Deployment command submitted."

      - name: Wait for Deployment and Verify Status
        env:
          COMMAND_ID: ${{ steps.ssm_deploy.outputs.command_id }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID || vars.EC2_INSTANCE_ID }}
        run: |
          set -e

          for attempt in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS ($attempt/30)"

            case "$STATUS" in
              Success)
                echo "ForestWatch deployment completed successfully."
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "ERROR: Timed out waiting for deployment."
          exit 1
