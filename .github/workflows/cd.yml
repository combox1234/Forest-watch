name: ForestWatch Continuous Delivery (CD)

on:
  workflow_run:
    workflows: ["ForestWatch CI/CD Pipeline"]
    branches: ["main"]
    types:
      - completed

  workflow_dispatch:
    inputs:
      target_commit:
        description: "Commit SHA to deploy, or main for latest"
        required: false
        default: "main"

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy to AWS EC2 (Production)
    runs-on: ubuntu-latest

    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}

    environment:
      name: production
      url: http://${{ vars.EC2_PUBLIC_IP || 'aws-ec2' }}/

    permissions:
      contents: read
      actions: read

    steps:
      # --------------------------------------------------
      # 1. Validate deployment prerequisites
      # --------------------------------------------------
      - name: Validate Deployment Prerequisites
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID || vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          echo "Starting ForestWatch deployment..."

          if [[ -z "$AWS_ACCESS_KEY_ID" ]]; then
            echo "ERROR: AWS_ACCESS_KEY_ID secret is missing."
            exit 1
          fi

          if [[ -z "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "ERROR: AWS_SECRET_ACCESS_KEY secret is missing."
            exit 1
          fi

          if [[ -z "$INSTANCE_ID" ]]; then
            echo "ERROR: EC2_INSTANCE_ID is missing."
            exit 1
          fi

          if [[ ! "$INSTANCE_ID" =~ ^i-[0-9a-fA-F]+$ ]]; then
            echo "ERROR: EC2_INSTANCE_ID has an invalid format."
            exit 1
          fi

          echo "AWS credentials configured."
          echo "Region: $AWS_REGION"
          echo "Target instance: $INSTANCE_ID"

      # --------------------------------------------------
      # 2. Resolve deployment commit
      # --------------------------------------------------
      - name: Validate and Resolve Deployment Commit
        id: resolve_commit
        env:
          INPUT_COMMIT: ${{ inputs.target_commit }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            COMMIT="${INPUT_COMMIT:-main}"
          else
            COMMIT="$WORKFLOW_SHA"
          fi

          if [[ ! "$COMMIT" =~ ^(main|[0-9a-fA-F]{7,40})$ ]]; then
            echo "ERROR: Invalid commit SHA or branch."
            exit 1
          fi

          RESOLVED_SHA=$(gh api \
            "repos/${REPO}/commits/${COMMIT}" \
            --jq '.sha')

          if [[ ! "$RESOLVED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "ERROR: Could not resolve deployment commit."
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            CI_RUNS=$(gh api \
              "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${RESOLVED_SHA}&status=completed&per_page=100" \
              --jq '[.workflow_runs[] |
                select(
                  .conclusion == "success" and
                  .head_branch == "main"
                )
              ] | length')

            if [[ "${CI_RUNS:-0}" -lt 1 ]]; then
              echo "ERROR: No successful main-branch CI run found for this commit."
              exit 1
            fi
          fi

          echo "target_commit=$RESOLVED_SHA" >> "$GITHUB_OUTPUT"

          echo "Validated commit: $RESOLVED_SHA"

      # --------------------------------------------------
      # 3. Configure AWS credentials
      # --------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      # --------------------------------------------------
      # 4. Verify AWS and SSM access
      # --------------------------------------------------
      - name: Verify AWS Access
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID || vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "AWS IDENTITY"
          echo "========================================"

          aws sts get-caller-identity

          echo
          echo "========================================"
          echo "TARGET EC2 INSTANCE"
          echo "========================================"

          echo "Region: $AWS_REGION"
          echo "Instance ID: $INSTANCE_ID"

          aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[].Instances[].{ID:InstanceId,State:State.Name}' \
            --output table

          echo
          echo "========================================"
          echo "ALL SSM MANAGED NODES"
          echo "========================================"

          aws ssm describe-instance-information \
            --region "$AWS_REGION" \
            --query 'InstanceInformationList[].{ID:InstanceId,PingStatus:PingStatus,AgentVersion:AgentVersion,Platform:PlatformName}' \
            --output table

          echo
          echo "========================================"
          echo "VERIFY TARGET SSM REGISTRATION"
          echo "========================================"

          # Read all pages and match the exact EC2 instance ID.
          SSM_STATUS=$(aws ssm describe-instance-information \
            --region "$AWS_REGION" \
            --output json |
            jq -r --arg ID "$INSTANCE_ID" \
              '[.InstanceInformationList[] |
                select(.InstanceId == $ID) |
                .PingStatus][0] // "NotRegistered"')

          echo "Target SSM status: $SSM_STATUS"

          if [[ "$SSM_STATUS" != "Online" ]]; then
            echo "ERROR: The target instance is not Online in SSM."
            echo "Check the instance IAM role, SSM Agent, and AWS region."
            exit 1
          fi

          echo "SUCCESS: Target EC2 instance is Online in SSM."

      # --------------------------------------------------
      # 5. Dispatch deployment through SSM
      # --------------------------------------------------
      - name: Dispatch Deployment via SSM
        id: ssm_deploy
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID || vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
          COMMIT_SHA: ${{ steps.resolve_commit.outputs.target_commit }}
        run: |
          set -euo pipefail

          echo "Submitting ForestWatch deployment..."
          echo "Commit: $COMMIT_SHA"

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "ForestWatch deployment $COMMIT_SHA" \
            --parameters "$(jq -cn \
              --arg commit "$COMMIT_SHA" \
              '{
                commands: [
                  "set -euo pipefail",
                  "cd /home/ubuntu/Forest-watch",
                  ("bash deploy_aws.sh " + $commit)
                ]
              }')" \
            --query 'Command.CommandId' \
            --output text)

          if [[ -z "$COMMAND_ID" || "$COMMAND_ID" == "None" ]]; then
            echo "ERROR: Failed to submit SSM deployment command."
            exit 1
          fi

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

          echo "Deployment command submitted."
          echo "SSM Command ID: $COMMAND_ID"

      # --------------------------------------------------
      # 6. Wait for deployment and report status
      # --------------------------------------------------
      - name: Wait for Deployment and Verify Status
        env:
          COMMAND_ID: ${{ steps.ssm_deploy.outputs.command_id }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID || vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
        run: |
          set -euo pipefail

          echo "Waiting for deployment to finish..."

          for attempt in $(seq 1 60); do

            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS ($attempt/60)"

            case "$STATUS" in
              Success)
                echo
                echo "========================================"
                echo "DEPLOYMENT SUCCEEDED"
                echo "========================================"

                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent}' \
                  --output json

                exit 0
                ;;

              Failed|Cancelled|TimedOut)
                echo
                echo "========================================"
                echo "DEPLOYMENT FAILED"
                echo "========================================"

                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent,ResponseCode:ResponseCode}' \
                  --output json || true

                exit 1
                ;;

              Pending|InProgress|Delayed|Cancelling|Undeliverable|Terminated)
                sleep 10
                ;;

              *)
                echo "Waiting for SSM command status..."
                sleep 10
                ;;
            esac

          done

          echo "ERROR: Timed out waiting for deployment."
          echo "SSM Command ID: $COMMAND_ID"
          exit 1
