name: ForestWatch Continuous Delivery (CD)

on:
  workflow_run:
    workflows:
      - "ForestWatch CI/CD Pipeline"
    branches:
      - main
    types:
      - completed

  workflow_dispatch:
    inputs:
      target_commit:
        description: "Commit SHA to deploy, or main for latest main"
        required: false
        default: "main"
        type: string

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy-production:
    name: Deploy to AWS EC2 (Production)
    runs-on: ubuntu-latest

    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}

    environment:
      name: production
      url: http://${{ vars.EC2_PUBLIC_IP || 'aws-ec2' }}/

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID || vars.EC2_INSTANCE_ID }}

    steps:
      - name: Validate Deployment Prerequisites
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "FORESTWATCH PRODUCTION DEPLOYMENT"
          echo "========================================"

          if [[ -z "${AWS_ACCESS_KEY_ID:-}" ]]; then
            echo "::error::AWS_ACCESS_KEY_ID is missing."
            exit 1
          fi

          if [[ -z "${AWS_SECRET_ACCESS_KEY:-}" ]]; then
            echo "::error::AWS_SECRET_ACCESS_KEY is missing."
            exit 1
          fi

          if [[ -z "${INSTANCE_ID:-}" ]]; then
            echo "::error::EC2_INSTANCE_ID is missing."
            exit 1
          fi

          if [[ ! "$INSTANCE_ID" =~ ^i-[0-9a-fA-F]+$ ]]; then
            echo "::error::Invalid EC2 instance ID."
            exit 1
          fi

          echo "Region: $AWS_REGION"
          echo "Instance: $INSTANCE_ID"
          echo "Prerequisites validated."

      - name: Resolve and Validate Deployment Commit
        id: resolve_commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_COMMIT: ${{ inputs.target_commit }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            COMMIT="${INPUT_COMMIT:-main}"
          else
            COMMIT="$WORKFLOW_SHA"
          fi

          if [[ ! "$COMMIT" =~ ^(main|[0-9a-fA-F]{7,40})$ ]]; then
            echo "::error::Invalid branch or commit SHA."
            exit 1
          fi

          echo "Resolving commit: $COMMIT"

          RESOLVED_SHA=$(gh api \
            "repos/${REPO}/commits/${COMMIT}" \
            --jq '.sha')

          if [[ ! "$RESOLVED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Could not resolve deployment commit."
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Checking successful CI execution..."

            CI_RUNS=$(gh api \
              "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${RESOLVED_SHA}&status=completed&per_page=100" \
              --jq '[.workflow_runs[] |
                select(
                  .conclusion == "success" and
                  .head_branch == "main"
                )
              ] | length')

            if [[ "${CI_RUNS:-0}" -lt 1 ]]; then
              echo "::error::No successful main-branch CI run for $RESOLVED_SHA."
              exit 1
            fi
          fi

          echo "target_commit=$RESOLVED_SHA" >> "$GITHUB_OUTPUT"
          echo "Validated commit: $RESOLVED_SHA"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Verify AWS Account and EC2 Instance
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "AWS IDENTITY"
          echo "========================================"

          aws sts get-caller-identity

          echo "========================================"
          echo "VERIFY EC2 INSTANCE"
          echo "========================================"

          echo "Region: $AWS_REGION"
          echo "Instance ID: $INSTANCE_ID"

          EC2_STATE=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)

          echo "EC2 state: $EC2_STATE"

          if [[ "$EC2_STATE" != "running" ]]; then
            echo "::error::EC2 instance is not running."
            exit 1
          fi

          echo "========================================"
          echo "VERIFY SSM REGISTRATION"
          echo "========================================"

          SSM_JSON=$(aws ssm describe-instance-information \
            --region "$AWS_REGION" \
            --output json)

          SSM_STATUS=$(printf '%s' "$SSM_JSON" |
            python3 -c '
          import json
          import os
          import sys

          data = json.load(sys.stdin)
          target = os.environ["INSTANCE_ID"]

          for item in data.get("InstanceInformationList", []):
              if item.get("InstanceId") == target:
                  print(item.get("PingStatus", "Unknown"))
                  sys.exit(0)

          print("NotRegistered")
          ')

          echo "Target instance: $INSTANCE_ID"
          echo "SSM status: $SSM_STATUS"

          if [[ "$SSM_STATUS" != "Online" ]]; then
            echo "::error::Target instance is not Online in SSM."

            echo "SSM-managed instances in this region:"

            printf '%s' "$SSM_JSON" | python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          for item in data.get("InstanceInformationList", []):
              print(
                  "InstanceId={}; Status={}; AgentVersion={}".format(
                      item.get("InstanceId", ""),
                      item.get("PingStatus", ""),
                      item.get("AgentVersion", "")
                  )
              )
          '

            echo "Verify that the configured instance ID matches the EC2 instance."
            exit 1
          fi

          echo "SUCCESS: EC2 instance is running and SSM is Online."

      - name: Dispatch Deployment via SSM
        id: ssm_deploy
        shell: bash
        env:
          COMMIT_SHA: ${{ steps.resolve_commit.outputs.target_commit }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "STARTING REMOTE DEPLOYMENT"
          echo "========================================"

          echo "Instance: $INSTANCE_ID"
          echo "Commit: $COMMIT_SHA"

          REMOTE_SCRIPT=$(cat <<EOF
          set -eu

          echo "========================================"
          echo "FORESTWATCH REMOTE DEPLOYMENT"
          echo "========================================"

          cd /home/ubuntu/Forest-watch

          echo "Repository directory verified."

          if [ ! -f deploy_aws.sh ]; then
            echo "ERROR: deploy_aws.sh was not found."
            exit 1
          fi

          chmod +x deploy_aws.sh

          echo "Checking deployment script syntax..."
          bash -n deploy_aws.sh

          echo "Deploying commit: $COMMIT_SHA"

          bash deploy_aws.sh "$COMMIT_SHA"

          echo "Remote deployment completed."
          EOF
          )

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "ForestWatch production deployment $COMMIT_SHA" \
            --parameters "$(jq -nc \
              --arg script "$REMOTE_SCRIPT" \
              '{commands: [$script]}')" \
            --query 'Command.CommandId' \
            --output text)

          if [[ -z "$COMMAND_ID" || "$COMMAND_ID" == "None" ]]; then
            echo "::error::SSM did not return a command ID."
            exit 1
          fi

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command submitted: $COMMAND_ID"

      - name: Wait for Deployment and Verify Status
        shell: bash
        env:
          COMMAND_ID: ${{ steps.ssm_deploy.outputs.command_id }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "WAIT FOR DEPLOYMENT"
          echo "========================================"

          MAX_ATTEMPTS=60
          SLEEP_SECONDS=10

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "Attempt $attempt/$MAX_ATTEMPTS - Status: $STATUS"

            case "$STATUS" in
              Success)
                echo
                echo "========================================"
                echo "DEPLOYMENT OUTPUT"
                echo "========================================"

                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text

                echo "SUCCESS: ForestWatch deployment completed."
                exit 0
                ;;

              Failed|Cancelled|TimedOut)
                echo "::error::Remote deployment failed: $STATUS"

                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json || true

                exit 1
                ;;

              Pending|InProgress|Delayed|Cancelling)
                sleep "$SLEEP_SECONDS"
                ;;

              *)
                echo "Command status: $STATUS"
                sleep "$SLEEP_SECONDS"
                ;;
            esac
          done

          echo "::error::Timed out waiting for remote deployment."

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json || true

          exit 1
