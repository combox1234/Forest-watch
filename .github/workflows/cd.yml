name: ForestWatch Continuous Delivery (CD)

on:
  workflow_run:
    workflows: ["ForestWatch CI/CD Pipeline"]
    branches: ["main"]
    types:
      - completed

  workflow_dispatch:
    inputs:
      target_commit:
        description: "Commit SHA to deploy, or main for latest"
        required: false
        default: "main"
        type: string

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy-production:
    name: Deploy to AWS EC2 (Production)
    runs-on: ubuntu-latest

    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}

    environment:
      name: production
      url: http://${{ vars.EC2_PUBLIC_IP || 'aws-ec2' }}/

    steps:
      # ================================================
      # 1. VALIDATE DEPLOYMENT CONFIGURATION
      # ================================================
      - name: Validate Deployment Prerequisites
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID || vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          echo "Starting ForestWatch deployment..."

          if [[ -z "$AWS_ACCESS_KEY_ID" ]]; then
            echo "::error::AWS_ACCESS_KEY_ID secret is missing."
            exit 1
          fi

          if [[ -z "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "::error::AWS_SECRET_ACCESS_KEY secret is missing."
            exit 1
          fi

          if [[ -z "$INSTANCE_ID" ]]; then
            echo "::error::EC2_INSTANCE_ID variable or secret is missing."
            exit 1
          fi

          if [[ ! "$INSTANCE_ID" =~ ^i-[0-9a-fA-F]+$ ]]; then
            echo "::error::EC2_INSTANCE_ID has an invalid format."
            exit 1
          fi

          echo "AWS credentials are configured."
          echo "Region: $AWS_REGION"
          echo "Target instance: $INSTANCE_ID"

      # ================================================
      # 2. VALIDATE AND RESOLVE DEPLOYMENT COMMIT
      # ================================================
      - name: Validate and Resolve Deployment Commit
        id: resolve_commit
        env:
          INPUT_COMMIT: ${{ inputs.target_commit }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            COMMIT="${INPUT_COMMIT:-main}"
          else
            COMMIT="$WORKFLOW_SHA"
          fi

          if [[ ! "$COMMIT" =~ ^(main|[0-9a-fA-F]{7,40})$ ]]; then
            echo "::error::Invalid commit SHA or branch."
            exit 1
          fi

          RESOLVED_SHA=$(gh api \
            "repos/${REPO}/commits/${COMMIT}" \
            --jq '.sha')

          if [[ ! "$RESOLVED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Could not resolve target commit."
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then

            CI_RUNS=$(gh api \
              "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${RESOLVED_SHA}&status=completed&per_page=100" \
              --jq '[.workflow_runs[] |
                select(
                  .conclusion == "success" and
                  .head_branch == "main"
                )
              ] | length')

            if [[ "${CI_RUNS:-0}" -lt 1 ]]; then
              echo "::error::No successful main-branch CI run found for this commit."
              exit 1
            fi

          fi

          echo "target_commit=$RESOLVED_SHA" >> "$GITHUB_OUTPUT"

          echo "Deployment commit validated: $RESOLVED_SHA"

      # ================================================
      # 3. CONFIGURE AWS CREDENTIALS
      # ================================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      # ================================================
      # 4. VERIFY AWS IDENTITY, EC2 AND SSM
      # ================================================
      - name: Verify AWS Access
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID || vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "AWS IDENTITY"
          echo "========================================"

          aws sts get-caller-identity

          echo
          echo "========================================"
          echo "VERIFY EC2 INSTANCE"
          echo "========================================"

          echo "Region: $AWS_REGION"
          echo "Instance ID: $INSTANCE_ID"

          aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[].Instances[].{ID:InstanceId,State:State.Name}' \
            --output table

          echo
          echo "========================================"
          echo "VERIFY SSM REGISTRATION"
          echo "========================================"

          SSM_RESPONSE=$(aws ssm describe-instance-information \
            --region "$AWS_REGION" \
            --output json)

          echo "SSM managed instances:"

          echo "$SSM_RESPONSE" | jq -r '
            .InstanceInformationList[] |
            "Instance: \(.InstanceId) | Status: \(.PingStatus) | Agent: \(.AgentVersion)"
          '

          SSM_STATUS=$(echo "$SSM_RESPONSE" | jq -r \
            --arg ID "$INSTANCE_ID" \
            'first(
              .InstanceInformationList[] |
              select(.InstanceId == $ID) |
              .PingStatus
            ) // "NotRegistered"')

          echo
          echo "Target instance: $INSTANCE_ID"
          echo "SSM status: $SSM_STATUS"

          if [[ "$SSM_STATUS" != "Online" ]]; then
            echo "::error::Target instance is not Online in SSM."
            echo "Check AWS account, region, instance ID and SSM permissions."
            exit 1
          fi

          echo "SUCCESS: Target instance is Online in SSM."

      # ================================================
      # 5. SUBMIT DEPLOYMENT COMMAND THROUGH SSM
      # ================================================
      - name: Dispatch Deployment via SSM
        id: ssm_deploy
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID || vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
          COMMIT_SHA: ${{ steps.resolve_commit.outputs.target_commit }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "SUBMIT FORESTWATCH DEPLOYMENT"
          echo "========================================"

          echo "Instance: $INSTANCE_ID"
          echo "Region: $AWS_REGION"
          echo "Commit: $COMMIT_SHA"

          PARAMETERS=$(jq -cn \
            --arg commit "$COMMIT_SHA" \
            '{
              commands: [
                "set -euo pipefail",
                "cd /home/ubuntu/Forest-watch",
                ("bash deploy_aws.sh " + $commit)
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "ForestWatch deployment $COMMIT_SHA" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          if [[ -z "$COMMAND_ID" || "$COMMAND_ID" == "None" ]]; then
            echo "::error::Failed to submit SSM deployment command."
            exit 1
          fi

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

          echo "Deployment command submitted successfully."
          echo "Command ID: $COMMAND_ID"

      # ================================================
      # 6. WAIT FOR DEPLOYMENT AND CHECK RESULT
      # ================================================
      - name: Wait for Deployment and Verify Status
        env:
          COMMAND_ID: ${{ steps.ssm_deploy.outputs.command_id }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID || vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "WAIT FOR DEPLOYMENT"
          echo "========================================"

          for attempt in $(seq 1 60); do

            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS ($attempt/60)"

            case "$STATUS" in

              Success)
                echo
                echo "========================================"
                echo "DEPLOYMENT SUCCEEDED"
                echo "========================================"

                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent}' \
                  --output json

                exit 0
                ;;

              Failed|Cancelled|TimedOut)
                echo
                echo "========================================"
                echo "DEPLOYMENT FAILED"
                echo "========================================"

                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json || true

                exit 1
                ;;

              Pending|InProgress|Delayed|Cancelling)
                sleep 10
                ;;

              *)
                echo "Command status is $STATUS. Waiting..."
                sleep 10
                ;;

            esac

          done

          echo "::error::Timed out waiting for deployment."
          echo "SSM Command ID: $COMMAND_ID"
          exit 1
