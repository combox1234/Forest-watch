name: ForestWatch Continuous Delivery (CD)

on:
  workflow_run:
    workflows: ["ForestWatch CI/CD Pipeline"]
    branches: ["main"]
    types:
      - completed

  workflow_dispatch:
    inputs:
      target_commit:
        description: "Specific Commit SHA to deploy (defaults to latest main)"
        required: false
        default: "main"

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy to AWS EC2 (Production)
    runs-on: ubuntu-latest

    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}

    environment:
      name: production
      url: http://${{ vars.EC2_PUBLIC_IP || 'aws-ec2' }}/

    permissions:
      contents: read
      actions: read

    steps:
      # --------------------------------------------------
      # STEP 1: Validate deployment configuration
      # --------------------------------------------------
      - name: Validate Deployment Prerequisites
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID || vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          echo "Starting ForestWatch deployment..."

          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::AWS_ACCESS_KEY_ID or AWS_SECRET_ACCESS_KEY secret is missing."
            exit 1
          fi

          if [ -z "$INSTANCE_ID" ]; then
            echo "::error::EC2_INSTANCE_ID is missing."
            exit 1
          fi

          if [[ ! "$INSTANCE_ID" =~ ^i-[0-9a-fA-F]+$ ]]; then
            echo "::error::EC2_INSTANCE_ID does not have a valid format."
            exit 1
          fi

          echo "AWS credentials and target instance are configured."
          echo "Region: $AWS_REGION"
          echo "Target instance ID: $INSTANCE_ID"

      # --------------------------------------------------
      # STEP 2: Resolve and validate deployment commit
      # --------------------------------------------------
      - name: Validate and Resolve Deployment Commit
        id: resolve_commit
        env:
          INPUT_COMMIT: ${{ inputs.target_commit }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            COMMIT="${INPUT_COMMIT:-main}"
          else
            COMMIT="$WORKFLOW_SHA"
          fi

          if [[ ! "$COMMIT" =~ ^(main|[0-9a-fA-F]{7,40})$ ]]; then
            echo "::error::Invalid commit or branch input."
            exit 1
          fi

          echo "Resolving deployment commit..."

          RESOLVED_SHA=$(gh api \
            "repos/${REPO}/commits/${COMMIT}" \
            --jq '.sha')

          if [[ ! "$RESOLVED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Could not resolve target commit."
            exit 1
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            CI_RUNS=$(gh api \
              "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${RESOLVED_SHA}&status=completed" \
              --jq '[.workflow_runs[] | select(.conclusion == "success" and .head_branch == "main")] | length')

            if [ "${CI_RUNS:-0}" -lt 1 ]; then
              echo "::error::No successful main-branch CI run found for this commit."
              exit 1
            fi
          fi

          echo "target_commit=$RESOLVED_SHA" >> "$GITHUB_OUTPUT"
          echo "Deployment commit validated."

      # --------------------------------------------------
      # STEP 3: Configure AWS credentials
      # --------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      # --------------------------------------------------
      # STEP 4: Diagnose AWS, EC2 and SSM configuration
      # --------------------------------------------------
      - name: Verify AWS Access
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID || vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
        run: |
          set -euo pipefail

          echo "=== AWS Identity ==="
          aws sts get-caller-identity

          echo "=== Target Instance ==="
          echo "Region: $AWS_REGION"
          echo "Instance ID: $INSTANCE_ID"

          echo "=== EC2 Instance Status ==="
          aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[].Instances[].{ID:InstanceId,State:State.Name}' \
            --output table

          echo "=== SSM Registration ==="
          aws ssm describe-instance-information \
            --region "$AWS_REGION" \
            --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
            --query 'InstanceInformationList[].{ID:InstanceId,PingStatus:PingStatus,AgentVersion:AgentVersion}' \
            --output table

          echo "=== SSM Online Verification ==="

          PING_STATUS=$(aws ssm describe-instance-information \
            --region "$AWS_REGION" \
            --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text)

          if [ "$PING_STATUS" != "Online" ]; then
            echo "::error::Target EC2 instance is not Online in Systems Manager. Status: $PING_STATUS"
            exit 1
          fi

          echo "AWS identity, EC2 instance and SSM registration verified."

      # --------------------------------------------------
      # STEP 5: Submit deployment through SSM
      # --------------------------------------------------
      - name: Dispatch Deployment via SSM
        id: ssm_deploy
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID || vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
          COMMIT_SHA: ${{ steps.resolve_commit.outputs.target_commit }}
        run: |
          set -euo pipefail

          echo "Submitting ForestWatch deployment command..."
          echo "Target instance: $INSTANCE_ID"
          echo "Region: $AWS_REGION"
          echo "Commit: $COMMIT_SHA"

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "ForestWatch deployment $COMMIT_SHA" \
            --parameters "$(jq -cn \
              --arg commit "$COMMIT_SHA" \
              '{
                commands: [
                  "set -e",
                  "cd /home/ubuntu/Forest-watch",
                  ("bash deploy_aws.sh " + $commit)
                ]
              }')" \
            --query 'Command.CommandId' \
            --output text)

          if [ -z "$COMMAND_ID" ] || [ "$COMMAND_ID" = "None" ]; then
            echo "::error::SSM did not return a command ID."
            exit 1
          fi

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Deployment command submitted successfully."

      # --------------------------------------------------
      # STEP 6: Wait for deployment and report result
      # --------------------------------------------------
      - name: Wait for Deployment and Verify Status
        env:
          COMMAND_ID: ${{ steps.ssm_deploy.outputs.command_id }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID || vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
        run: |
          set -euo pipefail

          echo "Waiting for ForestWatch deployment..."

          for attempt in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS ($attempt/30)"

            case "$STATUS" in
              Success)
                echo "ForestWatch deployment completed successfully."
                exit 0
                ;;

              Failed|Cancelled|TimedOut)
                echo "::error::ForestWatch deployment failed."

                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{
                    Status:Status,
                    StatusDetails:StatusDetails,
                    Output:StandardOutputContent,
                    Error:StandardErrorContent
                  }' \
                  --output json || true

                exit 1
                ;;
            esac

            sleep 10
          done

          echo "::error::Timed out waiting for deployment."
          exit 1
