name: ForestWatch Continuous Delivery (CD)

on:
  workflow_run:
    workflows:
      - "ForestWatch CI/CD Pipeline"
    branches:
      - main
    types:
      - completed

  workflow_dispatch:
    inputs:
      target_commit:
        description: "Commit SHA or main branch to deploy"
        required: false
        default: "main"
        type: string

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy-production:
    name: Deploy to AWS EC2 (Production)
    runs-on: ubuntu-latest

    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}

    environment:
      name: production

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID || secrets.EC2_INSTANCE_ID }}

    steps:
      - name: Validate Deployment Prerequisites
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VALIDATE DEPLOYMENT CONFIGURATION"
          echo "========================================"

          if [[ -z "${AWS_ACCESS_KEY_ID:-}" ]]; then
            echo "::error::Missing AWS_ACCESS_KEY_ID repository secret."
            exit 1
          fi

          if [[ -z "${AWS_SECRET_ACCESS_KEY:-}" ]]; then
            echo "::error::Missing AWS_SECRET_ACCESS_KEY repository secret."
            exit 1
          fi

          if [[ -z "${INSTANCE_ID:-}" ]]; then
            echo "::error::Missing EC2_INSTANCE_ID repository variable or secret."
            exit 1
          fi

          if [[ ! "$INSTANCE_ID" =~ ^i-[0-9a-fA-F]{8}([0-9a-fA-F]{9})?$ ]]; then
            echo "::error::EC2_INSTANCE_ID has an invalid format."
            exit 1
          fi

          echo "AWS region: $AWS_REGION"
          echo "Target instance: $INSTANCE_ID"
          echo "Configuration validation passed."

      - name: Resolve and Validate Deployment Commit
        id: resolve_commit
        shell: bash
        env:
          INPUT_COMMIT: ${{ inputs.target_commit }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            COMMIT="${INPUT_COMMIT:-main}"
          else
            COMMIT="$WORKFLOW_SHA"
          fi

          if [[ ! "$COMMIT" =~ ^(main|[0-9a-fA-F]{7,40})$ ]]; then
            echo "::error::Invalid branch or commit SHA."
            exit 1
          fi

          RESOLVED_SHA="$(gh api \
            "repos/$REPOSITORY/commits/$COMMIT" \
            --jq '.sha')"

          if [[ ! "$RESOLVED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Could not resolve the deployment commit."
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            CI_RUNS="$(gh api \
              "repos/$REPOSITORY/actions/workflows" \
              --jq '.workflows[] | select(.name == "ForestWatch CI/CD Pipeline") | .id' |
              head -n 1)"

            if [[ -z "$CI_RUNS" ]]; then
              echo "::error::Could not find the ForestWatch CI/CD Pipeline workflow."
              exit 1
            fi

            SUCCESSFUL_RUNS="$(gh api \
              "repos/$REPOSITORY/actions/workflows/$CI_RUNS/runs?head_sha=$RESOLVED_SHA&status=completed&per_page=100" \
              --jq '[.workflow_runs[] | select(.conclusion == "success" and .head_branch == "main")] | length')"

            if [[ "$SUCCESSFUL_RUNS" -lt 1 ]]; then
              echo "::error::No successful main-branch CI run exists for this commit."
              exit 1
            fi
          fi

          echo "target_commit=$RESOLVED_SHA" >> "$GITHUB_OUTPUT"
          echo "Validated deployment commit: $RESOLVED_SHA"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Account and EC2 Instance
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "AWS IDENTITY"
          echo "========================================"

          CALLER_ACCOUNT="$(aws sts get-caller-identity \
            --query 'Account' \
            --output text)"

          echo "AWS account: $CALLER_ACCOUNT"
          echo "AWS region: $AWS_REGION"
          echo "Instance ID: $INSTANCE_ID"

          if [[ "$CALLER_ACCOUNT" != "800728769662" ]]; then
            echo "::error::AWS account mismatch. Expected account 800728769662."
            exit 1
          fi

          echo "========================================"
          echo "VERIFY EC2 INSTANCE"
          echo "========================================"

          aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[].Instances[].{InstanceId:InstanceId,State:State.Name}' \
            --output table

          echo "========================================"
          echo "VERIFY SSM REGISTRATION"
          echo "========================================"

          # Query the exact instance ID. Retry briefly to allow for
          # transient SSM registration or propagation delays.
          SSM_STATUS="NotRegistered"

          for attempt in $(seq 1 6); do
            echo "SSM verification attempt $attempt/6"

            SSM_STATUS="$(aws ssm describe-instance-information \
              --region "$AWS_REGION" \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || true)"

            if [[ "$SSM_STATUS" == "Online" ]]; then
              break
            fi

            echo "Current SSM status: $SSM_STATUS"
            sleep 10
          done

          if [[ "$SSM_STATUS" != "Online" ]]; then
            echo "::error::Instance $INSTANCE_ID is not Online in SSM in region $AWS_REGION."
            echo "Verify the instance ID, account, region, IAM instance profile, and SSM Agent."
            exit 1
          fi

          echo "SUCCESS: EC2 instance is Online in SSM."

      - name: Dispatch Deployment via SSM
        id: ssm_deploy
        shell: bash
        env:
          COMMIT_SHA: ${{ steps.resolve_commit.outputs.target_commit }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "SUBMIT DEPLOYMENT"
          echo "========================================"

          COMMAND_ID="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "ForestWatch deployment $COMMIT_SHA" \
            --parameters "$(jq -nc \
              --arg commit "$COMMIT_SHA" \
              '{
                commands: [
                  "set -euo pipefail",
                  "cd /home/ubuntu/Forest-watch",
                  "bash deploy_aws.sh " + $commit
                ]
              }')" \
            --query 'Command.CommandId' \
            --output text)"

          if [[ -z "$COMMAND_ID" || "$COMMAND_ID" == "None" ]]; then
            echo "::error::SSM did not return a command ID."
            exit 1
          fi

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Deployment command submitted: $COMMAND_ID"

      - name: Wait for Deployment and Verify Status
        shell: bash
        env:
          COMMAND_ID: ${{ steps.ssm_deploy.outputs.command_id }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "WAIT FOR DEPLOYMENT"
          echo "========================================"

          for attempt in $(seq 1 60); do
            STATUS="$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)"

            echo "Attempt $attempt/60 - Status: ${STATUS:-Pending}"

            case "$STATUS" in
              Success)
                echo "========================================"
                echo "DEPLOYMENT OUTPUT"
                echo "========================================"

                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text

                echo "ForestWatch deployment completed successfully."
                exit 0
                ;;

              Failed|Cancelled|TimedOut)
                echo "::error::Deployment failed with status: $STATUS"

                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json || true

                exit 1
                ;;
            esac

            sleep 10
          done

          echo "::error::Timed out waiting for deployment command $COMMAND_ID."

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json || true

          exit 1
