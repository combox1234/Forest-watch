name: ForestWatch Continuous Delivery (CD)

on:
  workflow_run:
    workflows: ["ForestWatch CI/CD Pipeline"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forestwatch-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ForestWatch to EC2 through SSM
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID || vars.EC2_INSTANCE_ID }}
      EXPECTED_AWS_ACCOUNT_ID: '800728769662'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Validate AWS target
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${INSTANCE_ID:-}" || "$INSTANCE_ID" == "None" ]]; then
            echo "::error::Set EC2_INSTANCE_ID in GitHub repository or environment secrets."
            exit 1
          fi

          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          [[ "$ACCOUNT_ID" == "$EXPECTED_AWS_ACCOUNT_ID" ]] || {
            echo "::error::AWS credentials point to account $ACCOUNT_ID, expected $EXPECTED_AWS_ACCOUNT_ID."
            exit 1
          }

          STATE="$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)"
          [[ "$STATE" == "running" ]] || {
            echo "::error::EC2 instance state is $STATE, not running."
            exit 1
          }

          SSM_STATUS="$(aws ssm describe-instance-information \
            --region "$AWS_REGION" \
            --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text)"
          [[ "$SSM_STATUS" == "Online" ]] || {
            echo "::error::EC2 SSM status is $SSM_STATUS, not Online."
            exit 1
          }

      - name: Select commit to deploy
        id: target
        shell: bash
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            COMMIT="$WORKFLOW_RUN_SHA"
          else
            COMMIT="$GITHUB_SHA"
          fi
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Could not determine a valid commit SHA."
            exit 1
          }
          echo "sha=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "Deploying commit: $COMMIT"

      - name: Send deployment command through SSM
        id: send
