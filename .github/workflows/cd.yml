name: ForestWatch Continuous Delivery (CD)

on:
  workflow_run:
    workflows:
      - "ForestWatch CI/CD Pipeline"
    branches:
      - main
    types:
      - completed

  workflow_dispatch:
    inputs:
      target_commit:
        description: "Commit SHA to deploy, or main for latest main"
        required: false
        default: "main"
        type: string

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy-production:
    name: Deploy to AWS EC2 (Production)
    runs-on: ubuntu-latest

    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}

    environment:
      name: production
      url: http://${{ vars.EC2_PUBLIC_IP || 'aws-ec2' }}/

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID || vars.EC2_INSTANCE_ID }}

    steps:
      # --------------------------------------------------
      # 1. Validate deployment configuration
      # --------------------------------------------------
      - name: Validate Deployment Prerequisites
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "FORESTWATCH PRODUCTION DEPLOYMENT"
          echo "========================================"

          if [[ -z "${AWS_ACCESS_KEY_ID:-}" ]]; then
            echo "::error::AWS_ACCESS_KEY_ID secret is missing."
            exit 1
          fi

          if [[ -z "${AWS_SECRET_ACCESS_KEY:-}" ]]; then
            echo "::error::AWS_SECRET_ACCESS_KEY secret is missing."
            exit 1
          fi

          if [[ -z "${INSTANCE_ID:-}" ]]; then
            echo "::error::EC2_INSTANCE_ID is missing."
            exit 1
          fi

          if [[ ! "$INSTANCE_ID" =~ ^i-[0-9a-fA-F]+$ ]]; then
            echo "::error::EC2_INSTANCE_ID is not a valid EC2 instance ID."
            exit 1
          fi

          echo "Region: $AWS_REGION"
          echo "Target instance: $INSTANCE_ID"
          echo "Prerequisites validated."

      # --------------------------------------------------
      # 2. Resolve deployment commit
      # --------------------------------------------------
      - name: Resolve and Validate Deployment Commit
        id: resolve_commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_COMMIT: ${{ inputs.target_commit }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            COMMIT="${INPUT_COMMIT:-main}"
          else
            COMMIT="$WORKFLOW_SHA"
          fi

          if [[ ! "$COMMIT" =~ ^(main|[0-9a-fA-F]{7,40})$ ]]; then
            echo "::error::Invalid branch or commit SHA."
            exit 1
          fi

          echo "Resolving commit: $COMMIT"

          RESOLVED_SHA=$(gh api \
            "repos/${REPO}/commits/${COMMIT}" \
            --jq '.sha')

          if [[ ! "$RESOLVED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Could not resolve deployment commit."
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Checking for a successful main-branch CI run..."

            CI_RUNS=$(gh api \
              "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${RESOLVED_SHA}&status=completed&per_page=100" \
              --jq '[.workflow_runs[] |
                select(
                  .conclusion == "success" and
                  .head_branch == "main"
                )
              ] | length')

            if [[ "${CI_RUNS:-0}" -lt 1 ]]; then
              echo "::error::No successful main-branch CI run found for $RESOLVED_SHA."
              exit 1
            fi
          fi

          echo "target_commit=$RESOLVED_SHA" >> "$GITHUB_OUTPUT"

          echo "Validated deployment commit: $RESOLVED_SHA"

      # --------------------------------------------------
      # 3. Configure AWS credentials
      # --------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      # --------------------------------------------------
      # 4. Verify AWS account, EC2 and SSM
      # --------------------------------------------------
      - name: Verify AWS Account and EC2 Instance
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "AWS IDENTITY"
          echo "========================================"

          aws sts get-caller-identity

          echo
          echo "========================================"
          echo "VERIFY EC2 INSTANCE"
          echo "========================================"

          echo "Region: $AWS_REGION"
          echo "Instance ID: $INSTANCE_ID"

          EC2_STATE=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)

          echo "EC2 state: $EC2_STATE"

          if [[ "$EC2_STATE" != "running" ]]; then
            echo "::error::EC2 instance is not running. State: $EC2_STATE"
            exit 1
          fi

          echo
          echo "========================================"
          echo "VERIFY SSM REGISTRATION"
          echo "========================================"

          # AWS CLI applies pagination automatically.
          # Filter the returned records by the exact EC2 ID.
          SSM_STATUS=$(aws ssm describe-instance-information \
            --region "$AWS_REGION" \
            --output json \
            --query "InstanceInformationList[?InstanceId=='${INSTANCE_ID}'].PingStatus | [0]" \
            --output text)

          echo "Target instance: $INSTANCE_ID"
          echo "SSM status: $SSM_STATUS"

          if [[ "$SSM_STATUS" != "Online" ]]; then
            echo "::error::Instance is not Online in SSM."
            echo "Check the instance IAM role, region, and SSM Agent."

            echo "All SSM-managed instances in this region:"

            aws ssm describe-instance-information \
              --region "$AWS_REGION" \
              --query 'InstanceInformationList[].{InstanceId:InstanceId,PingStatus:PingStatus,AgentVersion:AgentVersion}' \
              --output table

            exit 1
          fi

          echo
          echo "SUCCESS: EC2 is running and registered with SSM."

      # --------------------------------------------------
      # 5. Dispatch deployment through SSM
      # --------------------------------------------------
      - name: Dispatch Deployment via SSM
        id: ssm_deploy
        shell: bash
        env:
          COMMIT_SHA: ${{ steps.resolve_commit.outputs.target_commit }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "STARTING REMOTE DEPLOYMENT"
          echo "========================================"

          echo "Instance: $INSTANCE_ID"
          echo "Commit: $COMMIT_SHA"

          # IMPORTANT:
          # AWS-RunShellScript may execute commands using /bin/sh.
          # Therefore the remote script uses POSIX-compatible syntax.
          REMOTE_SCRIPT=$(cat <<EOF
          set -eu

          echo "========================================"
          echo "FORESTWATCH REMOTE DEPLOYMENT"
          echo "========================================"

          cd /home/ubuntu/Forest-watch

          echo "Repository directory verified."

          if [ ! -f deploy_aws.sh ]; then
            echo "ERROR: deploy_aws.sh was not found."
            exit 1
          fi

          chmod +x deploy_aws.sh

          echo "Running deployment for commit: $COMMIT_SHA"

          bash deploy_aws.sh "$COMMIT_SHA"

          echo "Remote deployment script completed."
          EOF
          )

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "ForestWatch production deployment $COMMIT_SHA" \
            --parameters "$(jq -nc \
              --arg script "$REMOTE_SCRIPT" \
              '{commands: [$script]}')" \
            --query 'Command.CommandId' \
            --output text)

          if [[ -z "$COMMAND_ID" || "$COMMAND_ID" == "None" ]]; then
            echo "::error::AWS SSM did not return a command ID."
            exit 1
          fi

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

          echo "SSM command submitted: $COMMAND_ID"

      # --------------------------------------------------
      # 6. Wait for remote deployment and display logs
      # --------------------------------------------------
      - name: Wait for Deployment and Verify Status
        shell: bash
        env:
          COMMAND_ID: ${{ steps.ssm_deploy.outputs.command_id }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "WAIT FOR DEPLOYMENT"
          echo "========================================"

          MAX_ATTEMPTS=60
          SLEEP_SECONDS=10

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do

            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "Attempt $attempt/$MAX_ATTEMPTS - Status: $STATUS"

            case "$STATUS" in
              Success)
                echo
                echo "========================================"
                echo "DEPLOYMENT OUTPUT"
                echo "========================================"

                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text

                echo
                echo "SUCCESS: ForestWatch deployment completed."
                exit 0
                ;;

              Failed|Cancelled|TimedOut)
                echo
                echo "::error::Remote deployment ended with status: $STATUS"

                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json || true

                exit 1
                ;;

              Pending|InProgress|Delayed|Cancelling)
                sleep "$SLEEP_SECONDS"
                ;;

              *)
                echo "Command status: $STATUS"
                sleep "$SLEEP_SECONDS"
                ;;
            esac

          done

          echo "::error::Timed out waiting for remote deployment."

          echo "Final command details:"

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json || true

          exit 1
