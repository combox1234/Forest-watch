name: ForestWatch Continuous Delivery (CD)

on:
  workflow_run:
    workflows: ["ForestWatch CI/CD Pipeline"]
    branches: ["main"]
    types:
      - completed

  workflow_dispatch:
    inputs:
      target_commit:
        description: "Commit SHA or main branch to deploy"
        required: false
        default: "main"

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy-production:
    name: Deploy to AWS EC2 (Production)
    runs-on: ubuntu-latest

    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}

    environment:
      name: production
      url: http://${{ vars.EC2_PUBLIC_IP || 'aws-ec2' }}/

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID || vars.EC2_INSTANCE_ID }}

    steps:
      - name: Validate Deployment Prerequisites
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VALIDATE DEPLOYMENT CONFIGURATION"
          echo "========================================"

          if [[ -z "${AWS_ACCESS_KEY_ID:-}" ]]; then
            echo "::error::AWS_ACCESS_KEY_ID secret is missing."
            exit 1
          fi

          if [[ -z "${AWS_SECRET_ACCESS_KEY:-}" ]]; then
            echo "::error::AWS_SECRET_ACCESS_KEY secret is missing."
            exit 1
          fi

          if [[ -z "${INSTANCE_ID:-}" ]]; then
            echo "::error::EC2_INSTANCE_ID is missing."
            exit 1
          fi

          if [[ ! "$INSTANCE_ID" =~ ^i-[0-9a-fA-F]+$ ]]; then
            echo "::error::EC2_INSTANCE_ID is invalid."
            exit 1
          fi

          echo "AWS region: $AWS_REGION"
          echo "EC2 instance configured: $INSTANCE_ID"
          echo "Prerequisites validated."

      - name: Resolve and Validate Deployment Commit
        id: resolve_commit
        env:
          INPUT_COMMIT: ${{ inputs.target_commit }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            COMMIT="${INPUT_COMMIT:-main}"
          else
            COMMIT="$WORKFLOW_SHA"
          fi

          if [[ ! "$COMMIT" =~ ^(main|[0-9a-fA-F]{7,40})$ ]]; then
            echo "::error::Invalid branch or commit SHA."
            exit 1
          fi

          echo "Resolving commit: $COMMIT"

          RESOLVED_SHA=$(gh api \
            "repos/${REPO}/commits/${COMMIT}" \
            --jq '.sha')

          if [[ ! "$RESOLVED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Could not resolve deployment commit."
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            CI_RUNS=$(gh api \
              "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${RESOLVED_SHA}&status=completed&per_page=100" \
              --jq '[.workflow_runs[] |
                select(
                  .conclusion == "success" and
                  .head_branch == "main"
                )] | length')

            if [[ "${CI_RUNS:-0}" -lt 1 ]]; then
              echo "::error::No successful main-branch CI run found for $RESOLVED_SHA."
              exit 1
            fi
          fi

          echo "target_commit=$RESOLVED_SHA" >> "$GITHUB_OUTPUT"
          echo "Validated deployment commit: $RESOLVED_SHA"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Verify AWS Account and EC2 Instance
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "AWS IDENTITY"
          echo "========================================"

          aws sts get-caller-identity

          echo
          echo "========================================"
          echo "VERIFY EC2 INSTANCE"
          echo "========================================"

          aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].{ID:InstanceId,State:State.Name}' \
            --output table

          echo
          echo "========================================"
          echo "VERIFY SSM CONNECTIVITY"
          echo "========================================"

          # Explicitly filter by the exact instance ID.
          SSM_STATUS=$(aws ssm describe-instance-information \
            --region "$AWS_REGION" \
            --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text)

          echo "Target instance: $INSTANCE_ID"
          echo "SSM status: $SSM_STATUS"

          if [[ "$SSM_STATUS" != "Online" ]]; then
            echo "::error::EC2 instance is not Online in SSM."
            echo "Check the instance IAM role, SSM Agent, and region."
            exit 1
          fi

          echo "SUCCESS: EC2 instance is Online in SSM."

      - name: Dispatch Deployment via SSM
        id: ssm_deploy
        env:
          COMMIT_SHA: ${{ steps.resolve_commit.outputs.target_commit }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "DISPATCH PRODUCTION DEPLOYMENT"
          echo "========================================"

          # Use JSON encoding to safely pass commands to SSM.
          python3 - <<'PY'
          import json
          import os

          commands = [
              "bash -c 'set -eu; cd /home/ubuntu/Forest-watch; exec bash ./deploy_aws.sh \"$1\"' _ "
              + os.environ["COMMIT_SHA"]
          ]

          with open("/tmp/ssm-commands.json", "w") as f:
              json.dump({"commands": commands}, f)
          PY

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "ForestWatch deployment ${COMMIT_SHA}" \
            --parameters file:///tmp/ssm-commands.json \
            --query 'Command.CommandId' \
            --output text)

          if [[ -z "$COMMAND_ID" || "$COMMAND_ID" == "None" ]]; then
            echo "::error::SSM did not return a command ID."
            exit 1
          fi

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

          echo "Deployment command submitted."
          echo "Command ID: $COMMAND_ID"
          echo "Commit: $COMMIT_SHA"

      - name: Wait for Deployment and Verify Status
        env:
          COMMAND_ID: ${{ steps.ssm_deploy.outputs.command_id }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "WAIT FOR DEPLOYMENT"
          echo "========================================"

          for attempt in $(seq 1 60); do

            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "Attempt $attempt/60 - Status: $STATUS"

            case "$STATUS" in
              Success)
                echo
                echo "========================================"
                echo "DEPLOYMENT OUTPUT"
                echo "========================================"

                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text

                echo
                echo "SUCCESS: ForestWatch deployment completed."
                exit 0
                ;;

              Failed|Cancelled|TimedOut)
                echo
                echo "::error::Deployment failed with status: $STATUS"

                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json || true

                exit 1
                ;;

              *)
                sleep 10
                ;;
            esac
          done

          echo "::error::Timed out waiting for deployment after 10 minutes."

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --output json || true

          exit 1
