name: ForestWatch Continuous Delivery (CD)

on:
  workflow_run:
    workflows:
      - "ForestWatch CI/CD Pipeline"
    branches:
      - main
    types:
      - completed

  workflow_dispatch:
    inputs:
      target_commit:
        description: "Commit SHA to deploy, or main for latest main"
        required: false
        default: "main"
        type: string

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy-production:
    name: Deploy to AWS EC2 (Production)
    runs-on: ubuntu-latest

    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}

    environment:
      name: production
      url: http://${{ vars.EC2_PUBLIC_IP || 'aws-ec2' }}/

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID || vars.EC2_INSTANCE_ID }}

    steps:
      # --------------------------------------------------
      # 1. VALIDATE DEPLOYMENT CONFIGURATION
      # --------------------------------------------------
      - name: Validate Deployment Prerequisites
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "FORESTWATCH PRODUCTION DEPLOYMENT"
          echo "========================================"

          if [[ -z "${AWS_ACCESS_KEY_ID:-}" ]]; then
            echo "::error::AWS_ACCESS_KEY_ID is missing."
            exit 1
          fi

          if [[ -z "${AWS_SECRET_ACCESS_KEY:-}" ]]; then
            echo "::error::AWS_SECRET_ACCESS_KEY is missing."
            exit 1
          fi

          if [[ -z "${INSTANCE_ID:-}" ]]; then
            echo "::error::EC2_INSTANCE_ID is missing."
            exit 1
          fi

          if [[ ! "$INSTANCE_ID" =~ ^i-[0-9a-fA-F]+$ ]]; then
            echo "::error::EC2_INSTANCE_ID has an invalid format."
            exit 1
          fi

          if [[ ! "$AWS_REGION" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::AWS_REGION has an invalid format."
            exit 1
          fi

          echo "AWS region configured: $AWS_REGION"
          echo "EC2 instance ID configured."
          echo "Deployment prerequisites validated."

      # --------------------------------------------------
      # 2. RESOLVE THE COMMIT
      # --------------------------------------------------
      - name: Resolve and Validate Deployment Commit
        id: resolve_commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_COMMIT: ${{ inputs.target_commit }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            COMMIT="${INPUT_COMMIT:-main}"
          else
            COMMIT="$WORKFLOW_SHA"
          fi

          if [[ ! "$COMMIT" =~ ^(main|[0-9a-fA-F]{7,40})$ ]]; then
            echo "::error::Invalid branch or commit SHA."
            exit 1
          fi

          echo "Resolving deployment commit..."

          RESOLVED_SHA=$(gh api \
            "repos/${REPO}/commits/${COMMIT}" \
            --jq '.sha')

          if [[ ! "$RESOLVED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Unable to resolve the deployment commit."
            exit 1
          fi

          # Manual deployment must have a successful main CI run.
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Checking successful CI execution..."

            CI_RUNS=$(gh api \
              "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${RESOLVED_SHA}&status=completed&per_page=100" \
              --jq '[.workflow_runs[] |
                select(
                  .conclusion == "success" and
                  .head_branch == "main"
                )
              ] | length')

            if [[ "${CI_RUNS:-0}" -lt 1 ]]; then
              echo "::error::No successful main-branch CI run exists for this commit."
              exit 1
            fi
          fi

          echo "target_commit=$RESOLVED_SHA" >> "$GITHUB_OUTPUT"
          echo "Validated deployment commit."

      # --------------------------------------------------
      # 3. CONFIGURE AWS
      # --------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      # --------------------------------------------------
      # 4. VERIFY AWS ACCOUNT AND EC2
      #
      # Do not fail because of a separate SSM listing check.
      # The actual send-command operation below is authoritative.
      # --------------------------------------------------
      - name: Verify AWS Account and EC2 Instance
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "AWS IDENTITY"
          echo "========================================"

          aws sts get-caller-identity

          echo
          echo "========================================"
          echo "VERIFY EC2 INSTANCE"
          echo "========================================"

          echo "Region: $AWS_REGION"
          echo "Checking configured EC2 instance..."

          INSTANCE_JSON=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --output json)

          EC2_STATE=$(printf '%s' "$INSTANCE_JSON" |
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)
          reservations = data.get("Reservations", [])

          if not reservations or not reservations[0].get("Instances"):
              print("NotFound")
              sys.exit(0)

          instance = reservations[0]["Instances"][0]
          print(instance.get("State", {}).get("Name", "Unknown"))
          ')

          echo "EC2 state: $EC2_STATE"

          if [[ "$EC2_STATE" != "running" ]]; then
            echo "::error::EC2 instance is not running."
            exit 1
          fi

          echo "SUCCESS: AWS credentials and EC2 instance verified."

      # --------------------------------------------------
      # 5. DEPLOY THROUGH AWS SYSTEMS MANAGER
      # --------------------------------------------------
      - name: Dispatch Deployment via SSM
        id: ssm_deploy
        shell: bash
        env:
          COMMIT_SHA: ${{ steps.resolve_commit.outputs.target_commit }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "STARTING FORESTWATCH DEPLOYMENT"
          echo "========================================"

          echo "Region: $AWS_REGION"
          echo "Commit: $COMMIT_SHA"
          echo "Submitting deployment command to SSM..."

          # IMPORTANT:
          # AWS-RunShellScript uses a remote shell.
          # Use "set -eu", NOT "set -euo pipefail".
          #
          # The actual deployment script is explicitly executed
          # through Bash, which supports Bash syntax.

          REMOTE_SCRIPT=$(cat <<'REMOTE_EOF'
          set -eu

          REPO_DIR="/home/ubuntu/Forest-watch"
          COMMIT_SHA="__FORESTWATCH_COMMIT_SHA__"

          echo "========================================"
          echo "FORESTWATCH REMOTE DEPLOYMENT"
          echo "========================================"

          if [ ! -d "$REPO_DIR" ]; then
            echo "ERROR: Repository directory does not exist: $REPO_DIR"
            exit 1
          fi

          cd "$REPO_DIR"

          echo "Repository directory verified."

          if [ ! -f "deploy_aws.sh" ]; then
            echo "ERROR: deploy_aws.sh was not found."
            exit 1
          fi

          chmod +x deploy_aws.sh

          echo "Checking deployment script syntax..."

          bash -n deploy_aws.sh

          echo "Deployment script syntax is valid."
          echo "Starting deployment for commit: $COMMIT_SHA"

          bash deploy_aws.sh "$COMMIT_SHA"

          echo "========================================"
          echo "REMOTE DEPLOYMENT COMPLETED"
          echo "========================================"
          REMOTE_EOF
          )

          # Insert the validated SHA without shell interpolation
          # of user-controlled command text.
          export COMMIT_SHA

          REMOTE_SCRIPT=$(python3 -c '
          import os
          import sys

          script = sys.stdin.read()
          commit = os.environ["COMMIT_SHA"]

          if not all(c in "0123456789abcdefABCDEF" for c in commit):
              raise SystemExit("Invalid commit SHA")

          if len(commit) != 40:
              raise SystemExit("Expected a full 40-character commit SHA")

          print(script.replace("__FORESTWATCH_COMMIT_SHA__", commit), end="")
          ' <<< "$REMOTE_SCRIPT")

          PARAMETERS=$(jq -nc \
            --arg script "$REMOTE_SCRIPT" \
            '{commands: [$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "ForestWatch production deployment $COMMIT_SHA" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          if [[ -z "$COMMAND_ID" || "$COMMAND_ID" == "None" ]]; then
            echo "::error::AWS Systems Manager did not return a command ID."
            exit 1
          fi

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

          echo "SSM deployment command submitted successfully."
          echo "Command ID: $COMMAND_ID"

      # --------------------------------------------------
      # 6. WAIT FOR DEPLOYMENT AND PRINT REAL ERRORS
      # --------------------------------------------------
      - name: Wait for Deployment and Verify Status
        shell: bash
        env:
          COMMAND_ID: ${{ steps.ssm_deploy.outputs.command_id }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "WAITING FOR DEPLOYMENT"
          echo "========================================"

          MAX_ATTEMPTS=60
          SLEEP_SECONDS=10

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do

            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "Attempt $attempt/$MAX_ATTEMPTS - Status: $STATUS"

            case "$STATUS" in

              Success)
                echo
                echo "========================================"
                echo "DEPLOYMENT OUTPUT"
                echo "========================================"

                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text

                echo
                echo "========================================"
                echo "DEPLOYMENT SUCCESSFUL"
                echo "========================================"

                exit 0
                ;;

              Failed|Cancelled|TimedOut)
                echo
                echo "::error::Remote deployment failed: $STATUS"

                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{
                    Status:Status,
                    ResponseCode:ResponseCode,
                    Output:StandardOutputContent,
                    Error:StandardErrorContent
                  }' \
                  --output json || true

                exit 1
                ;;

              Pending|InProgress|Delayed|Cancelling)
                sleep "$SLEEP_SECONDS"
                ;;

              *)
                echo "Waiting for SSM command status..."
                sleep "$SLEEP_SECONDS"
                ;;

            esac

          done

          echo "::error::Timed out waiting for deployment."

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{
              Status:Status,
              ResponseCode:ResponseCode,
              Output:StandardOutputContent,
              Error:StandardErrorContent
            }' \
            --output json || true

          exit 1
