name: ForestWatch CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Maven Build & Automated Unit/Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Automated Tests (SQLite Verification)
        run: mvn clean test --batch-mode

      - name: Package JAR Artifacts
        run: mvn package -DskipTests --batch-mode

      - name: Archive Test Results (Surefire Reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/*.txt
            **/target/surefire-reports/*.xml
          if-no-files-found: ignore

  validate-docker:
    name: Validate Docker & Compose Configurations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
          echo "✅ Docker Compose configuration is valid."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Central Server Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.central
          push: false
          tags: forestwatch/central-server:latest

      - name: Build Sensor Node Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.sensor
          push: false
          tags: forestwatch/sensor-server:latest

  validate-iac:
    name: Validate Terraform & Ansible Infrastructure Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Check Terraform Formatting
        run: terraform fmt -check aws/terraform/

      - name: Install Ansible Core & Lint
        run: |
          pip install ansible-core
          ansible-playbook --syntax-check -i aws/ansible/inventory.ini aws/ansible/playbook.yml
          echo "✅ Ansible playbook syntax check passed."

  k8s-manifest-lint:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Lint and Validate K8s Manifests
        run: |
          kubeconform -strict -summary -ignore-missing-schemas k8s/
