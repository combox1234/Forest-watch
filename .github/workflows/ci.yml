name: ForestWatch CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Maven Build & Automated Unit/Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Automated Tests
        run: mvn clean test --batch-mode

      - name: Package JAR Artifacts
        run: mvn package -DskipTests --batch-mode

      - name: Archive Test Results (Surefire Reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/*.txt
            **/target/surefire-reports/*.xml
          if-no-files-found: ignore

  container-build:
    name: Build & Validate Docker Containers
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Central Server Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.central
          push: false
          tags: forestwatch/central-server:latest

      - name: Build Sensor Node Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.sensor
          push: false
          tags: forestwatch/sensor-server:latest

  k8s-manifest-lint:
    name: Validate Kubernetes Manifests
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Lint and Validate K8s Manifests
        run: |
          kubeconform -strict -summary -ignore-missing-schemas k8s/
