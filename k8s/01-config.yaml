apiVersion: v1
kind: ConfigMap
metadata:
  name: ds-config
  namespace: ds-sensor-network
data:
  SQLITE_DB_PATH: "/data/forestwatch.db"
  CENTRAL_PORT: "8099"
  CENTRAL_URL: "http://central-server-svc:8099"
  AWS_REGION: "ap-south-1"
  AWS_S3_BUCKET: "forestwatch-telemetry-archive"
  AWS_LAMBDA_FUNCTION: "EmergencyAlertDispatcher"
---
apiVersion: v1
kind: Secret
metadata:
  name: ds-secrets
  namespace: ds-sensor-network
type: Opaque
stringData:
  FORESTWATCH_SECURITY_SERVICE_KEY: "change-this-to-a-strong-random-key-in-production"
  GRAFANA_ADMIN_PASSWORD: "change-this-to-a-secure-password"
