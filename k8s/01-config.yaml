apiVersion: v1
kind: ConfigMap
metadata:
  name: ds-config
  namespace: ds-sensor-network
data:
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "sensordb"
  CENTRAL_PORT: "8099"
  CENTRAL_URL: "http://central-server-svc:8099"
  AWS_REGION: "us-east-1"
  AWS_S3_BUCKET: "ds-environmental-telemetry-archive"
  AWS_LAMBDA_FUNCTION: "EmergencyAlertDispatcher"
---
apiVersion: v1
kind: Secret
metadata:
  name: ds-secrets
  namespace: ds-sensor-network
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgrespassword"
  FORESTWATCH_SECURITY_SERVICE_KEY: "forestwatch-internal-sensor-key-2026"
