apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: central-server-hpa
  namespace: ds-sensor-network
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: central-server
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
