apiVersion: apps/v1
kind: Deployment
metadata:
  name: central-server
  namespace: ds-sensor-network
  labels:
    app: central-server
spec:
  # SQLite requires a single-writer architecture; do NOT scale horizontally
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: central-server
  template:
    metadata:
      labels:
        app: central-server
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: central-server
          image: central-server:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8099
              name: http
          env:
            - name: SERVER_PORT
              value: "8099"
            - name: SQLITE_DB_PATH
              valueFrom:
                configMapKeyRef:
                  name: ds-config
                  key: SQLITE_DB_PATH
            - name: FORESTWATCH_SECURITY_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: ds-secrets
                  key: FORESTWATCH_SECURITY_SERVICE_KEY
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: ds-config
                  key: AWS_REGION
            - name: AWS_S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: ds-config
                  key: AWS_S3_BUCKET
            - name: AWS_LAMBDA_FUNCTION_NAME
              valueFrom:
                configMapKeyRef:
                  name: ds-config
                  key: AWS_LAMBDA_FUNCTION
          volumeMounts:
            - name: sqlite-storage
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8099
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8099
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              memory: "192Mi"
              cpu: "100m"
            limits:
              memory: "384Mi"
              cpu: "500m"
      volumes:
        - name: sqlite-storage
          persistentVolumeClaim:
            claimName: sqlite-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: central-server-svc
  namespace: ds-sensor-network
spec:
  type: ClusterIP
  ports:
    - port: 8099
      targetPort: 8099
      name: http
  selector:
    app: central-server
