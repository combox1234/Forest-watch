apiVersion: v1
kind: Service
metadata:
  name: ds-load-balancer
  namespace: ds-sensor-network
  labels:
    app: ds-load-balancer
    tier: load-balancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  ports:
    - name: http-dashboard
      port: 80
      targetPort: 8099
    - name: direct-dashboard
      port: 8099
      targetPort: 8099
  selector:
    app: central-server
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ds-ingress
  namespace: ds-sensor-network
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/load-balance: "round_robin"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: central-server-svc
                port:
                  number: 8099
          - path: /api/s1
            pathType: Prefix
            backend:
              service:
                name: sensor-1-svc
                port:
                  number: 8101
          - path: /api/s2
            pathType: Prefix
            backend:
              service:
                name: sensor-2-svc
                port:
                  number: 8102
