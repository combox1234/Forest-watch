apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-1
  namespace: ds-sensor-network
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sensor-1
  template:
    metadata:
      labels:
        app: sensor-1
    spec:
      containers:
        - name: sensor-1
          image: sensor-server:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8101
          env:
            - name: SERVER_PORT
              value: "8101"
            - name: NODE_ID
              value: "S1"
            - name: NODE_CLUSTER
              value: "C1"
            - name: NODE_PEERS
              value: "http://sensor-2-svc:8102"
            - name: NODE_CENTRAL_URL
              value: "http://central-server-svc:8099"
            - name: NODE_IS_INITIAL_LEADER
              value: "false"
            - name: FORESTWATCH_SECURITY_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: ds-secrets
                  key: FORESTWATCH_SECURITY_SERVICE_KEY
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8101
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8101
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"
---
apiVersion: v1
kind: Service
metadata:
  name: sensor-1-svc
  namespace: ds-sensor-network
spec:
  type: ClusterIP
  ports:
    - port: 8101
      targetPort: 8101
  selector:
    app: sensor-1
---
