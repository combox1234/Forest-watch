server.port=8099
spring.application.name=central-server
server.servlet.session.cookie.name=FW_CENTRAL_SESSION

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:centraldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

# Logging
logging.level.com.ds.sensor.central=INFO
logging.level.org.springframework.web=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Unit IV: AWS Cloud & Emerging Paradigms Configuration
aws.region=us-east-1
aws.s3.bucket=ds-environmental-telemetry-archive
aws.lambda.function-name=EmergencyAlertDispatcher

# Prometheus & Actuator Monitoring
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true


