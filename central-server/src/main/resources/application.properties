server.port=8099
spring.application.name=central-server
server.servlet.session.cookie.name=FW_CENTRAL_SESSION

# SQLite Database Configuration
# Default local path: data/forestwatch.db
# In container/k8s: override via SQLITE_DB_PATH or SPRING_DATASOURCE_URL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlite:${SQLITE_DB_PATH:data/forestwatch.db}}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# Hibernate Configuration for SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# SQLite Single-Writer / Connection Pool Optimization
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-init-sql=PRAGMA busy_timeout=10000;

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

# Logging
logging.level.com.ds.sensor.central=INFO
logging.level.org.springframework.web=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Unit IV: AWS Cloud & Emerging Paradigms Configuration
aws.region=ap-south-1
aws.s3.bucket=ds-environmental-telemetry-archive
aws.lambda.function-name=EmergencyAlertDispatcher

# Prometheus & Actuator Monitoring
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
