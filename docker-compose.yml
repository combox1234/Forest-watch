version: '3.8'

services:
  # Central PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ds-postgres
    environment:
      POSTGRES_DB: sensordb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sensordb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Central Server Process (:8000)
  central-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.central
    container_name: ds-central-server
    ports:
      - "8000:8000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sensordb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-ds-environmental-telemetry-archive}
      AWS_LAMBDA_FUNCTION_NAME: ${AWS_LAMBDA_FUNCTION_NAME:-EmergencyAlertDispatcher}
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx160m -XX:+UseSerialGC"
    depends_on:
      postgres:
        condition: service_healthy

  # Sensor Node 1 (:8101) - Cluster 1
  sensor-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.sensor
    container_name: ds-sensor-1
    ports:
      - "8101:8101"
    environment:
      SERVER_PORT: 8101
      NODE_ID: S1
      NODE_CLUSTER: C1
      NODE_PEERS: http://sensor-2:8102
      NODE_CENTRAL_URL: http://central-server:8000
      NODE_IS_INITIAL_LEADER: "false"
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx140m -XX:+UseSerialGC"
    depends_on:
      - central-server

  # Sensor Node 2 (:8102) - Cluster 1 Initial Head
  sensor-2:
    build:
      context: .
      dockerfile: docker/Dockerfile.sensor
    container_name: ds-sensor-2
    ports:
      - "8102:8102"
    environment:
      SERVER_PORT: 8102
      NODE_ID: S2
      NODE_CLUSTER: C1
      NODE_PEERS: http://sensor-1:8101
      NODE_CENTRAL_URL: http://central-server:8000
      NODE_IS_INITIAL_LEADER: "true"
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx140m -XX:+UseSerialGC"
    depends_on:
      - central-server

  # Sensor Node 3 (:8103) - Cluster 2
  sensor-3:
    build:
      context: .
      dockerfile: docker/Dockerfile.sensor
    container_name: ds-sensor-3
    ports:
      - "8103:8103"
    environment:
      SERVER_PORT: 8103
      NODE_ID: S3
      NODE_CLUSTER: C2
      NODE_PEERS: http://sensor-4:8104
      NODE_CENTRAL_URL: http://central-server:8000
      NODE_IS_INITIAL_LEADER: "false"
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx140m -XX:+UseSerialGC"
    depends_on:
      - central-server

  # Sensor Node 4 (:8104) - Cluster 2 Initial Head
  sensor-4:
    build:
      context: .
      dockerfile: docker/Dockerfile.sensor
    container_name: ds-sensor-4
    ports:
      - "8104:8104"
    environment:
      SERVER_PORT: 8104
      NODE_ID: S4
      NODE_CLUSTER: C2
      NODE_PEERS: http://sensor-3:8103
      NODE_CENTRAL_URL: http://central-server:8000
      NODE_IS_INITIAL_LEADER: "true"
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx140m -XX:+UseSerialGC"
    depends_on:
      - central-server

  # Layer 7 Reverse Proxy & Load Balancer (:80)
  load-balancer:
    image: nginx:alpine
    container_name: ds-load-balancer
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx-load-balancer.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - central-server

volumes:
  pgdata:

