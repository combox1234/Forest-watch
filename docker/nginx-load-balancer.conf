# ==============================================================================
# Layer 7 Reverse Proxy & Load Balancer Configuration
# Course: Distributed Systems (Unit IV: Distributed Web-Based Systems & Load Balancing)
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Upstream Pool for Central Server (Round-Robin with Health Checking)
    upstream central_backend {
        # Load balancing algorithm: round-robin (default) or least_conn
        # least_conn;
        server central-server:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        # Load balancer health status endpoint
        location /lb-status {
            default_type application/json;
            return 200 '{"loadBalancer": "NGINX", "status": "ACTIVE", "algorithm": "ROUND_ROBIN", "upstreamPool": "central_backend"}';
        }

        # Forward traffic to the backend cluster
        location / {
            proxy_pass http://central_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
