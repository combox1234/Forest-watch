# ==============================================================================
# Layer 7 Reverse Proxy & Load Balancer Configuration
# Course: Distributed Systems (Unit IV: Distributed Web-Based Systems & Load Balancing)
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Upstream Pool for Central Server (Round-Robin with Health Checking)
    upstream central_backend {
        # Load balancing algorithm: round-robin (default) or least_conn
        # least_conn;
        server central-server:8099 max_fails=3 fail_timeout=10s;
    }

    upstream sensor1_backend {
        server sensor-1:8101 max_fails=3 fail_timeout=10s;
    }

    upstream sensor2_backend {
        server sensor-2:8102 max_fails=3 fail_timeout=10s;
    }

    upstream sensor3_backend {
        server sensor-3:8103 max_fails=3 fail_timeout=10s;
    }

    upstream sensor4_backend {
        server sensor-4:8104 max_fails=3 fail_timeout=10s;
    }

    # Dynamic Layer 7 Routing: Map browser Referer to target sensor or central node
    map $http_referer $api_backend {
        ~*/sensor1/ sensor1_backend;
        ~*/sensor2/ sensor2_backend;
        ~*/sensor3/ sensor3_backend;
        ~*/sensor4/ sensor4_backend;
        default     central_backend;
    }

    server {
        listen 80;
        server_name localhost;

        # Load balancer health status endpoint
        location /lb-status {
            default_type application/json;
            return 200 '{"loadBalancer": "NGINX", "status": "ACTIVE", "algorithm": "LAYER_7_CONTENT_AWARE", "upstreamPool": "central_backend"}';
        }

        # Dynamic /api/ routing: dispatches to the correct sensor if called from that sensor's console
        location /api/ {
            proxy_pass http://$api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Sensor Node 1 Console & API
        location /sensor1/ {
            proxy_pass http://sensor1_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location = /sensor1 {
            return 301 /sensor1/;
        }

        # Sensor Node 2 Console & API
        location /sensor2/ {
            proxy_pass http://sensor2_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location = /sensor2 {
            return 301 /sensor2/;
        }

        # Sensor Node 3 Console & API
        location /sensor3/ {
            proxy_pass http://sensor3_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location = /sensor3 {
            return 301 /sensor3/;
        }

        # Sensor Node 4 Console & API
        location /sensor4/ {
            proxy_pass http://sensor4_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location = /sensor4 {
            return 301 /sensor4/;
        }

        # Forward traffic to the central backend cluster
        location / {
            proxy_pass http://central_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
