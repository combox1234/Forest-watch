# Default Sensor Server Configuration
spring.application.name=sensor-server

# Default port (overridden by sensor1.properties ... sensor4.properties)
server.port=8101
server.servlet.session.cookie.name=FW_${node.id:S1}_SESSION

# Default node identification
node.id=S1
node.cluster=C1
node.peers=http://localhost:8102
node.central-url=http://localhost:8099
node.is-initial-leader=false

# Logging
logging.level.com.ds.sensor=INFO

# Prometheus & Actuator Monitoring
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true

